[project]
name = "aegis-lab"
version = "0.1.0"
description = "Crash-tolerant, hardware-aware model editing platform"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pyzmq>=25.1",
    "torch>=2.1",
    "transformers>=4.46",
]

readme = "README.md"

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
gui = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "psutil>=5.9",
]
hardware = [
    "openvino>=2024.0",
    "numpy>=1.24",
]
dev = [
    "coverage>=7.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "fastapi>=0.110",
    "httpx>=0.23.0",
]

[project.scripts]
aegis = "aegis_lab.cli.main:main"
aegis-neurosurgery = "aegis_lab.editing.neurosurgery.cli:main"
aegis-neurosurgery-advanced = "aegis_lab.editing.neurosurgery.cli_extended:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aegis_lab*"]
